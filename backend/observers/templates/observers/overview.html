{% extends "observers/base.html" %}
{% block content %}
<h1>{{ t.overview }}</h1>
<div class="cards">
  {% for c in cards %}<div class="card"><div class="v"><bdi>{{ c.value }}</bdi></div><div class="l">{{ c.label }}</div></div>{% endfor %}
</div>
<div class="panel">
  <div class="legend">
    <span><span class="sw" style="background:#006D6B"></span>{{ t.legend_days }}</span>
    <span><span class="sw" style="background:#F4B432"></span>{{ t.legend_wages }}</span>
  </div>
  <svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" width="100%" style="max-width:{{ chart.width }}px" role="img" aria-label="{{ t.weekly_chart }}" dir="ltr">
    <line x1="24" y1="{{ chart.base_y }}" x2="{{ chart.width }}" y2="{{ chart.base_y }}" stroke="currentColor" stroke-opacity=".25"/>
    {% for b in chart.bars %}
      <rect x="{{ b.x }}" y="{{ b.y }}" width="13" height="{{ b.h }}" rx="2" fill="{% if b.series == 0 %}#006D6B{% else %}#F4B432{% endif %}"><title>{{ b.value }}</title></rect>
      {% if b.h %}<text x="{{ b.x|add:6 }}" y="{{ b.y|add:-3 }}" font-size="9" text-anchor="middle" fill="currentColor">{{ b.value }}</text>{% endif %}
      {% if b.label %}<text x="{{ b.label_x }}" y="{{ chart.base_y|add:16 }}" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">{{ b.label }}</text>{% endif %}
    {% endfor %}
  </svg>
</div>
<p class="note">{{ t.export_note }}</p>
{% endblock %}
