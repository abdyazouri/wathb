# Wathb (وَثْب) for iPhone. Generate the Xcode project with: xcodegen generate
name: Wathb
options:
  bundleIdPrefix: com.wathb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    API_BASE_URL: "https:/$()/wathb-api2.onrender.com/api/v1/"
targets:
  Wathb:
    type: application
    platform: iOS
    sources:
      - path: Wathb
        # actool needs an installed iOS simulator runtime; until one is, the icon ships as
        # plain PNGs (Resources/Icons + CFBundleIcons). To use the catalog, remove the excludes and set ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon.
        excludes:
          - "Resources/Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wathb.app
        PRODUCT_NAME: Wathb
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Wathb/Info.plist
    info:
      path: Wathb/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleDisplayName: "وَثْب"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ApiBaseUrl: $(API_BASE_URL)
        NSFaceIDUsageDescription: "لفتح وَثْب وتأكيد استلام أجرك بوجهك بدل كلمة المرور."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UIAppFonts:
          - thmanyahsans_light.otf
          - thmanyahsans_regular.otf
          - thmanyahsans_medium.otf
          - thmanyahsans_bold.otf
          - thmanyahsans_black.otf
        LSApplicationQueriesSchemes: [whatsapp]
